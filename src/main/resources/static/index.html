<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BookStore</title><link rel="stylesheet" href="/css/style.css"></head>
<body><header><div><strong>BookStore</strong><span> Sistema de Vendas de Livros</span></div><button id="sair" class="secondary">Sair</button></header><main class="container"><section class="welcome"><div><h1>Painel da livraria</h1><p>Gerencie seu catálogo e suas categorias.</p></div><span id="usuario"></span></section>
<nav><button class="tab active" data-tab="livros">Livros</button><button class="tab" data-tab="categorias">Categorias</button><button class="tab" data-tab="usuarios">Usuários</button></nav>
<section id="livros" class="panel"><div class="panel-head"><h2>Livros cadastrados</h2><button id="novoLivro">+ Novo livro</button></div><form id="formLivro" class="form-grid hidden"><input type="hidden" id="livroId"><label>Título<input id="titulo" required></label><label>Autor<input id="autor" required></label><label>ISBN<input id="isbn" required></label><label>Preço (R$)<input id="preco" type="number" step="0.01" min="0" required></label><label>Estoque<input id="estoque" type="number" min="0" value="0"></label><label>Categoria<select id="categoriaLivro"></select></label><div class="actions"><button type="submit">Salvar</button><button type="button" id="cancelarLivro" class="secondary">Cancelar</button></div></form><div class="table-wrap"><table><thead><tr><th>Título</th><th>Autor</th><th>ISBN</th><th>Preço</th><th>Estoque</th><th>Ações</th></tr></thead><tbody id="listaLivros"></tbody></table></div></section>
<section id="categorias" class="panel hidden"><div class="panel-head"><h2>Categorias</h2><button id="novaCategoria">+ Nova categoria</button></div><form id="formCategoria" class="form-grid hidden"><input type="hidden" id="categoriaId"><label>Nome<input id="catNome" required></label><label>Descrição<input id="catDescricao"></label><label>Departamento<input id="catDepartamento"></label><label>Ativa<select id="catAtiva"><option value="true">Sim</option><option value="false">Não</option></select></label><div class="actions"><button>Salvar</button><button type="button" id="cancelarCategoria" class="secondary">Cancelar</button></div></form><div class="table-wrap"><table><thead><tr><th>Nome</th><th>Descrição</th><th>Departamento</th><th>Ativa</th><th>Ações</th></tr></thead><tbody id="listaCategorias"></tbody></table></div></section>
<section id="usuarios" class="panel hidden"><div class="panel-head"><h2>Usuários</h2><button id="novoUsuario">+ Novo usuário</button></div><form id="formUsuario" class="form-grid hidden"><input type="hidden" id="usuarioId"><label>Nome<input id="userNome" required></label><label>E-mail<input id="userEmail" type="email" required></label><label>Senha<input id="userSenha" type="password" required></label><div class="actions"><button>Salvar</button><button type="button" id="cancelarUsuario" class="secondary">Cancelar</button></div></form><div class="table-wrap"><table><thead><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Ações</th></tr></thead><tbody id="listaUsuarios"></tbody></table></div></section><p id="feedback" class="feedback"></p></main><script src="/js/app.js"></script></body></html>
