<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BookStore | Login</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="login-bg">
    <main class="login-card">
        <h1>BookStore</h1>
        <p>Entre para gerenciar sua livraria</p>

        <form id="loginForm">
            <label>E-mail</label>
            <input id="email" type="email" value="admin@bookstore.com" required>

            <label>Senha</label>
            <input id="senha" type="password" value="123456" required>

            <button>Entrar</button>
            <p id="msg" class="msg"></p>
        </form>

        <p>Não tem uma conta? <a href="/cadastro.html">Cadastre-se</a></p>

        <small>Usuário inicial: admin@bookstore.com / 123456</small>
    </main>

    <script src="/js/login.js"></script>
</body>
</html>
